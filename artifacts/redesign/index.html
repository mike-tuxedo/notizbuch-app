<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notizbuch – Redesign: Hauptansicht</title>
<style>
/* ── Tokens ─────────────────────────────────────────── */
:root,[data-theme="light"]{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f1f3f6;
  --border:#d3d8e0; --border-strong:#7d8797;
  --text:#14171c; --text-2:#3f4755;
  --accent:#0b7285; --accent-soft:#dcf1f4; --on-accent:#ffffff;
  --danger:#b3261e; --danger-soft:#fbe9e7; --ok:#17754a; --warn:#8a5800;
  --shadow:0 2px 6px rgba(20,23,28,.10),0 12px 32px rgba(20,23,28,.16);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#111317; --surface:#1b1e24; --surface-2:#262a32;
  --border:#3b414c; --border-strong:#8791a1;
  --text:#f3f5f8; --text-2:#c9cfd9;
  --accent:#74b8ff; --accent-soft:#1c3554; --on-accent:#08182b;
  --danger:#ff8f85; --danger-soft:#3d1f1d; --ok:#62d6a0; --warn:#f2c060;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{
  /* Zeichenfläche: in beiden Themes identisch */
  --paper:#ffffff; --paper-line:#dde3ec; --ink:#14171c; --select:#0b63c5;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --tap:44px; --bar-h:56px; --drawer-w:300px;
  --r-sm:8px; --r-lg:14px; --r-pill:999px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:clamp(20px,2.4vw,26px);
}

/* ── Basis ──────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 var(--fs-md)/1.45 var(--font-ui);color:var(--text);background:var(--bg);display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
h1{font-size:var(--fs-xl);font-weight:700;line-height:1.2}
h2{font-size:var(--fs-lg);font-weight:700}
h3{font-size:var(--fs-md);font-weight:700}
.muted{color:var(--text-2)}
.small{font-size:var(--fs-sm)}
.mono{font-family:var(--font-mono);font-size:var(--fs-sm);word-break:break-all}
[hidden]{display:none!important}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Buttons: eine Basis, drei Varianten ────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);
  border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text);
  font:600 var(--fs-md)/1 var(--font-ui);text-decoration:none;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.icon{width:var(--tap);padding:0}
.btn.block{width:100%}
.btn[aria-pressed="true"],.btn[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Formulare ──────────────────────────────────────── */
.field{display:grid;gap:var(--s1)}
.field label{font-weight:600}
.input{min-height:var(--tap);padding:0 var(--s3);border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);font:400 var(--fs-md) var(--font-ui);width:100%}
.input::placeholder{color:var(--text-2);opacity:.8}
.input:hover{border-color:var(--text)}
.input.error{border-color:var(--danger)}
.error-text{color:var(--danger);font-size:var(--fs-sm);font-weight:600}
.switch{appearance:none;width:52px;height:30px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface-2);
  position:relative;cursor:pointer;flex:none;margin:7px 0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--border-strong);transition:transform .15s}
.switch:checked{background:var(--accent);border-color:var(--accent)}
.switch:checked::after{transform:translateX(22px);background:var(--on-accent)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{min-height:calc(var(--tap) - 2px);padding:0 var(--s4);border:0;background:transparent;color:var(--text);font:600 var(--fs-md) var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;gap:var(--s2)}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* ── Flächen ────────────────────────────────────────── */
.popover{position:absolute;z-index:30;top:calc(100% + 8px);left:0;min-width:240px;padding:var(--s3);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.popover.right{left:auto;right:0}
.pop-wrap{position:relative;display:inline-flex}
.menu{display:grid;gap:2px}
.menu-item{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:0 var(--s3);border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--text);font:500 var(--fs-md) var(--font-ui);text-align:left;text-decoration:none;cursor:pointer;width:100%}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}
.menu-label{font-size:var(--fs-sm);font-weight:700;color:var(--text-2);padding:var(--s2) var(--s3) var(--s1)}
.sep{height:1px;background:var(--border);margin:var(--s2) 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5)}
.dialog{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(520px,100%);padding:var(--s5);display:grid;gap:var(--s4)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.row.between{justify-content:space-between;flex-wrap:nowrap}
.stack{display:grid;gap:var(--s4)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.status{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);font-weight:600;color:var(--text)}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok)}
.status.busy::before{background:var(--warn)}
.status.off::before{background:var(--danger)}
.note{padding:var(--s3) var(--s4);border-radius:var(--r-sm);background:var(--surface-2);border-left:4px solid var(--accent);font-size:var(--fs-sm)}
.note.warn{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--danger);background:var(--danger-soft)}
.toast{position:fixed;z-index:60;left:50%;bottom:88px;transform:translateX(-50%);display:flex;align-items:center;gap:var(--s3);
  padding:var(--s2) var(--s2) var(--s2) var(--s4);background:var(--text);color:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);font-weight:600;max-width:calc(100vw - 24px)}
.toast .btn{background:transparent;border-color:transparent;color:inherit;text-decoration:underline}
.qr{width:200px;height:200px;border-radius:var(--r-sm);border:10px solid #fff;outline:1px solid var(--border);
  background:repeating-conic-gradient(#14171c 0 25%,#fff 0 50%) 0 0/20px 20px,#fff;display:grid;place-items:center}
.qr span{background:#fff;color:#14171c;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px}

/* ── Prototyp-Leiste (nicht Teil der App) ───────────── */
.proto{display:flex;align-items:center;gap:var(--s1);padding:4px var(--s3);background:var(--surface-2);border-bottom:2px dashed var(--border-strong);font-size:var(--fs-sm);overflow-x:auto;flex:none}
.proto strong{margin-right:var(--s2);white-space:nowrap}
.proto a,.proto button{min-height:36px;padding:0 var(--s3);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text);font:600 var(--fs-sm) var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.proto a:hover,.proto button:hover{background:var(--surface)}
.proto a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.proto .push{margin-left:auto}
.page{flex:1;min-height:0;overflow:auto;padding:var(--s5) var(--s4)}
.page>.inner{max-width:920px;margin:0 auto;display:grid;gap:var(--s5)}


/* ── Hauptansicht ───────────────────────────────────── */
.stage{flex:1;min-height:0;display:flex;justify-content:center}
.frame{width:100%;height:100%;container:app/inline-size}
.stage.phone{padding:var(--s3)}
.stage.phone .frame{width:390px;max-width:100%;border:2px solid var(--border-strong);border-radius:22px;overflow:hidden}

.app{position:relative;height:100%;overflow:hidden;display:grid;background:var(--paper);
  grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;
  grid-template-areas:"left tools right" "canvas canvas canvas"}
.tb{display:flex;align-items:center;gap:var(--s2);min-height:var(--bar-h);padding:var(--s1) var(--s3);background:var(--surface);border-bottom:1px solid var(--border)}
.tb-left{grid-area:left;min-width:0}
.toolrow{grid-area:tools;justify-content:center;position:relative}
.tb-right{grid-area:right}
.divider{width:1px;height:28px;background:var(--border);margin:0 var(--s1);flex:none}

.title-btn{max-width:260px;padding:0 var(--s3) 0 var(--s2);font-size:var(--fs-lg);font-weight:700}
.title-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* Ein Schalter: Hand an = bewegen, Hand aus = zurück zum letzten Werkzeug */
.mode{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:var(--tap);min-width:var(--tap);padding:0 var(--s2);border-radius:var(--r-pill);
  background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);font:600 var(--fs-sm)/1 var(--font-ui);cursor:pointer;flex:none}
.mode .lbl{display:none}
.mode:hover{border-color:var(--text)}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.tools{display:flex;gap:2px}
.tool,.opt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:var(--tap);height:var(--tap);padding:0 6px;
  border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--text);font:600 12px/1 var(--font-ui);cursor:pointer}
.tool .lbl,.opt .lbl{display:none}
.tool:hover,.opt:hover{background:var(--surface-2)}
.opt[aria-expanded="true"]{background:var(--surface-2);border-color:var(--border-strong)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.app[data-mode="move"] .tool[aria-pressed="true"]{background:transparent;border-color:var(--border-strong);color:var(--text)}

/* Farbe und Strichstärke: zwei getrennte Knöpfe, jeder zeigt den aktuellen Stand */
.opt .dot{width:22px;height:22px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);outline:1px solid var(--border-strong)}
.opt .sizedot{width:22px;height:22px;display:grid;place-items:center}
.opt .sizedot i{width:7px;height:7px;border-radius:50%;background:var(--text)}
.swatches{display:grid;grid-template-columns:repeat(5,var(--tap));gap:var(--s1)}
.swatch{width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.swatch i{width:30px;height:30px;border-radius:50%;background:var(--c);outline:1px solid var(--border-strong)}
.swatch:hover i{transform:scale(1.1)}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}
.swatch.custom i{background:conic-gradient(#e03131,#f2c200,#2f9e44,#1971c2,#6741d9,#e03131)}
.sizes{display:grid;grid-template-columns:repeat(5,var(--tap));gap:var(--s1)}
.size{width:var(--tap);height:var(--tap);border-radius:var(--r-sm);border:1px solid transparent;background:transparent;cursor:pointer;display:grid;place-items:center}
.size i{width:var(--d);height:var(--d);border-radius:50%;background:var(--text)}
.size:hover{background:var(--surface-2)}
.size[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

/* Zeichenfläche: immer weiß */
.canvas{grid-area:canvas;position:relative;overflow:hidden;cursor:crosshair;background-color:var(--paper);
  background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:28px 28px}
.canvas[data-bg="lined"]{background-image:linear-gradient(var(--paper-line) 1px,transparent 1px)}
.canvas[data-bg="blank"]{background-image:none}
.app[data-mode="move"] .canvas{cursor:grab}
.canvas svg.art{position:absolute;inset:0;width:100%;height:100%;transition:transform .15s;transform-origin:center}
.sel{display:none}
.app[data-tool="select"][data-mode="draw"] .sel{display:block}
.float{position:absolute;display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);box-shadow:var(--shadow)}
.float .btn{border-radius:var(--r-pill);flex:none}
.float.selbar{left:50%;top:9%;transform:translateX(-50%);display:none}
.app[data-tool="select"][data-mode="draw"] .float.selbar{display:flex}
.pages{left:50%;bottom:var(--s4);transform:translateX(-50%)}
.zoom{right:var(--s4);bottom:var(--s4)}
/* Liegt Gezeichnetes außerhalb des Bildschirms, meldet sich „Alles zeigen“ */
#fit{position:relative}
.app[data-off="true"] #fit{background:var(--accent-soft);color:var(--accent)}
.app[data-off="true"] #fit::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.edge{right:var(--s4);top:50%;transform:translateY(-50%);padding:0 var(--s2) 0 var(--s4);min-height:var(--tap);gap:var(--s1);background:var(--accent);border-color:var(--accent);color:var(--on-accent);font:600 var(--fs-sm) var(--font-ui);cursor:pointer}
.edge:hover{filter:brightness(1.08)}
.hint{position:absolute;left:50%;top:var(--s3);transform:translateX(-50%);padding:6px var(--s3);border-radius:var(--r-pill);background:var(--text);color:var(--surface);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;display:none}
.app[data-mode="move"] .hint{display:block}

/* Notizbuch-Schublade */
.drawer{position:absolute;z-index:40;inset:0 auto 0 0;width:min(var(--drawer-w),86%);display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);box-shadow:var(--shadow)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s3) var(--s3) var(--s4);border-bottom:1px solid var(--border)}
.drawer .list{flex:1;overflow:auto;padding:var(--s2)}
.drawer footer{padding:var(--s2);border-top:1px solid var(--border);display:grid;gap:2px}
.nb{display:flex;align-items:center;border-radius:var(--r-sm)}
.nb .menu-item{flex:1;min-width:0;font-weight:600}
.nb .menu-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb.current{background:var(--accent-soft)}
.nb.current .menu-item{color:var(--accent)}
.backdrop{display:none;position:absolute;inset:0;z-index:35;background:rgba(10,12,16,.45)}
.app:has(.drawer:not([hidden])) .backdrop{display:block}

/* Großes Zeichen-Tablet: Beschriftungen einblenden */
@container app (min-width:1180px){
  .tool,.opt{min-width:68px;height:48px}
  .tool .lbl,.opt .lbl{display:block}
  .mode .lbl{display:inline}
  .mode{padding:0 var(--s4) 0 var(--s3)}
}
@container app (max-width:1000px){ .sync-text{display:none} .title-btn{max-width:160px} }
/* Handy: Werkzeuge nach unten (Daumen), oben nur Titel + Verlauf */
@container app (max-width:760px){
  .app{grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;grid-template-areas:"left right" "canvas canvas" "tools tools"}
  .toolrow{justify-content:space-between;gap:var(--s1);padding:var(--s1) var(--s2) max(var(--s1),env(safe-area-inset-bottom));border-bottom:0;border-top:1px solid var(--border)}
  .toolrow .divider,.zoom .zstep,.zoom .fitlbl{display:none}
  .toolrow,.tools{gap:0}
  .tool,.opt,.mode{min-width:40px;padding:0}
  .zoom{right:var(--s2);bottom:var(--s3)}
  .zoom #fit{width:var(--tap);padding:0}
  .pages{left:var(--s2);bottom:var(--s3);transform:none}
  .pages .btn:not(.icon){padding:0 var(--s2)}
  .toolrow .pop-wrap{position:static}
  .toolrow .popover{top:auto;bottom:calc(100% + 8px);left:var(--s2);right:var(--s2)}
  .swatches,.sizes{grid-template-columns:repeat(5,1fr);justify-items:center}
  .tb{padding:var(--s1) var(--s2)}
  .tb-right{gap:0}
}
</style>
</head>

<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>

<script>
(function () {
  const root = document.documentElement;
  const KEY = 'nb-proto-theme';
  root.dataset.theme = localStorage.getItem(KEY) ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  const close = (el) => {
    el.hidden = true;
    document.querySelectorAll('[data-toggle="#' + el.id + '"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  };
  const closeAll = () => document.querySelectorAll('[data-pop]:not([hidden])').forEach(close);

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-theme-toggle]')) {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(KEY, root.dataset.theme);
      return;
    }
    const tab = e.target.closest('[role="tab"]');
    if (tab) {
      const box = tab.closest('[data-tabs]');
      box.querySelectorAll('[role="tab"]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
      box.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
      return;
    }
    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const el = document.querySelector(tg.dataset.toggle);
      const wasOpen = !el.hidden;
      closeAll();
      if (!wasOpen) { el.hidden = false; tg.setAttribute('aria-expanded', 'true'); }
      return;
    }
    if (!e.target.closest('[data-pop]') || e.target.closest('[data-close]')) closeAll();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });

  let timer;
  window.toast = (msg, action) => {
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.innerHTML = '<span></span>';
    t.firstChild.textContent = msg;
    if (action) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = action;
      b.onclick = () => { t.remove(); window.toast('Wiederhergestellt'); };
      t.appendChild(b);
    }
    document.body.appendChild(t);
    clearTimeout(timer);
    timer = setTimeout(() => t.remove(), action ? 6000 : 2500);
  };
})();

(function () {
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
  const app = $('.app');
  const setMode = (m) => { app.dataset.mode = m; $('#mode').setAttribute('aria-pressed', String(m === 'move')); };
  $('#mode').onclick = () => setMode(app.dataset.mode === 'draw' ? 'move' : 'draw');

  const setTool = (t) => {
    app.dataset.tool = t;
    $$('.tool').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
    setMode('draw');
  };
  $$('.tool').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $$('[data-shape]').forEach((b) => b.addEventListener('click', () => {
    $('#shape-icon').setAttribute('href', '#i-' + b.dataset.shape);
    $('#pop-shapes').hidden = true;
    setTool('shape');
  }));

  const colors = [['#14171c', 'Schwarz'], ['#868e96', 'Grau'], ['#e03131', 'Rot'], ['#f08c00', 'Orange'], ['#f2c200', 'Gelb'],
    ['#2f9e44', 'Grün'], ['#0c8599', 'Türkis'], ['#1971c2', 'Blau'], ['#6741d9', 'Violett']];
  $('#swatches').innerHTML = colors.map(([c, n], i) =>
    `<button class="swatch" style="--c:${c}" data-c="${c}" aria-label="${n}" aria-pressed="${i === 0}"><i></i></button>`).join('') +
    '<button class="swatch custom" aria-label="Eigene Farbe wählen" aria-pressed="false"><i></i></button>';
  const sizes = [[4, 'Fein'], [7, 'Dünn'], [11, 'Mittel'], [16, 'Dick'], [24, 'Sehr dick']];
  $('#sizes').innerHTML = sizes.map(([d, n], i) =>
    `<button class="size" style="--d:${d}px" data-d="${d}" aria-label="${n}" aria-pressed="${i === 1}"><i></i></button>`).join('');
  const pick = (box, el) => $$(box + ' button').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
  $('#swatches').onclick = (e) => {
    const b = e.target.closest('.swatch'); if (!b) return;
    pick('#swatches', b);
    if (b.dataset.c) $('#chip-dot').style.background = b.dataset.c; else toast('Farbwähler – im Prototyp ohne Funktion');
  };
  $('#sizes').onclick = (e) => {
    const b = e.target.closest('.size'); if (!b) return;
    pick('#sizes', b);
    $('#chip-size').style.width = $('#chip-size').style.height = Math.min(20, b.dataset.d) + 'px';
  };
  $('#bg-seg').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    pick('#bg-seg', b); $('#canvas').dataset.bg = b.dataset.bg;
  };

  let page = 3, total = 7, zoom = 0;
  const show = () => { $('#pg').textContent = page + ' / ' + total; $('#prev').disabled = page === 1; $('#next').disabled = page === total; };
  $('#prev').onclick = () => { page--; show(); };
  $('#next').onclick = () => { page++; show(); };
  $('#add').onclick = () => { total++; page = total; show(); toast('Seite ' + total + ' angelegt'); };
  // Zoom ohne Prozentzahl: Bezugspunkt ist „alles Gezeichnete passt auf den Bildschirm“, nicht 100 %
  const view = () => {
    $('.art').style.transform = 'scale(' + Math.pow(1.35, zoom) + ')';
    const off = zoom > 0;               // im Prototyp: hineingezoomt = etwas liegt außerhalb
    app.dataset.off = String(off);
    $('#edge').hidden = !off;
  };
  const fit = () => { const was = zoom !== 0; zoom = 0; view(); if (was) toast('Alles im Blick'); };
  $$('[data-z]').forEach((b) => b.onclick = () => { zoom = Math.min(4, Math.max(-3, zoom + +b.dataset.z)); view(); });
  $('#fit').onclick = fit;
  $('#edge').onclick = fit;

  $('#undo').onclick = () => { $('#redo').disabled = false; };
  $('#redo').onclick = () => { $('#redo').disabled = true; };

  $('#phone-toggle').onclick = (e) => {
    const on = $('#stage').classList.toggle('phone');
    e.currentTarget.setAttribute('aria-pressed', String(on));
  };

  // Leertaste halten = vorübergehend Bewegen; Buchstaben wählen Werkzeuge
  let held = false;
  const keys = { p: 'pen', e: 'eraser', f: 'fill', s: 'shape', v: 'select' };
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input,textarea')) return;
    if (e.code === 'Space' && !held && app.dataset.mode === 'draw') { held = true; setMode('move'); e.preventDefault(); }
    else if (keys[e.key]) setTool(keys[e.key]);
    else if (e.key === 'h') $('#mode').click();
    else if (e.key === '0') fit();
  });
  document.addEventListener('keyup', (e) => { if (e.code === 'Space' && held) { held = false; setMode('draw'); } });
})();
</script>
