<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notizbuch – Redesign: Teilen</title>
<style>
/* ── Tokens ─────────────────────────────────────────── */
:root,[data-theme="light"]{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f1f3f6;
  --border:#d3d8e0; --border-strong:#7d8797;
  --text:#14171c; --text-2:#3f4755;
  --accent:#0b7285; --accent-soft:#dcf1f4; --on-accent:#ffffff;
  --danger:#b3261e; --danger-soft:#fbe9e7; --ok:#17754a; --warn:#8a5800;
  --shadow:0 2px 6px rgba(20,23,28,.10),0 12px 32px rgba(20,23,28,.16);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#111317; --surface:#1b1e24; --surface-2:#262a32;
  --border:#3b414c; --border-strong:#8791a1;
  --text:#f3f5f8; --text-2:#c9cfd9;
  --accent:#74b8ff; --accent-soft:#1c3554; --on-accent:#08182b;
  --danger:#ff8f85; --danger-soft:#3d1f1d; --ok:#62d6a0; --warn:#f2c060;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{
  /* Zeichenfläche: in beiden Themes identisch */
  --paper:#ffffff; --paper-line:#dde3ec; --ink:#14171c; --select:#0b63c5;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --tap:44px; --bar-h:56px; --drawer-w:300px;
  --r-sm:8px; --r-lg:14px; --r-pill:999px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:clamp(20px,2.4vw,26px);
}

/* ── Basis ──────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 var(--fs-md)/1.45 var(--font-ui);color:var(--text);background:var(--bg);display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
h1{font-size:var(--fs-xl);font-weight:700;line-height:1.2}
h2{font-size:var(--fs-lg);font-weight:700}
h3{font-size:var(--fs-md);font-weight:700}
.muted{color:var(--text-2)}
.small{font-size:var(--fs-sm)}
.mono{font-family:var(--font-mono);font-size:var(--fs-sm);word-break:break-all}
[hidden]{display:none!important}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Buttons: eine Basis, drei Varianten ────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);
  border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text);
  font:600 var(--fs-md)/1 var(--font-ui);text-decoration:none;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.icon{width:var(--tap);padding:0}
.btn.block{width:100%}
.btn[aria-pressed="true"],.btn[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Formulare ──────────────────────────────────────── */
.field{display:grid;gap:var(--s1)}
.field label{font-weight:600}
.input{min-height:var(--tap);padding:0 var(--s3);border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);font:400 var(--fs-md) var(--font-ui);width:100%}
.input::placeholder{color:var(--text-2);opacity:.8}
.input:hover{border-color:var(--text)}
.input.error{border-color:var(--danger)}
.error-text{color:var(--danger);font-size:var(--fs-sm);font-weight:600}
.switch{appearance:none;width:52px;height:30px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface-2);
  position:relative;cursor:pointer;flex:none;margin:7px 0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--border-strong);transition:transform .15s}
.switch:checked{background:var(--accent);border-color:var(--accent)}
.switch:checked::after{transform:translateX(22px);background:var(--on-accent)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{min-height:calc(var(--tap) - 2px);padding:0 var(--s4);border:0;background:transparent;color:var(--text);font:600 var(--fs-md) var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;gap:var(--s2)}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* ── Flächen ────────────────────────────────────────── */
.popover{position:absolute;z-index:30;top:calc(100% + 8px);left:0;min-width:240px;padding:var(--s3);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.popover.right{left:auto;right:0}
.pop-wrap{position:relative;display:inline-flex}
.menu{display:grid;gap:2px}
.menu-item{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:0 var(--s3);border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--text);font:500 var(--fs-md) var(--font-ui);text-align:left;text-decoration:none;cursor:pointer;width:100%}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}
.menu-label{font-size:var(--fs-sm);font-weight:700;color:var(--text-2);padding:var(--s2) var(--s3) var(--s1)}
.sep{height:1px;background:var(--border);margin:var(--s2) 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5)}
.dialog{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(520px,100%);padding:var(--s5);display:grid;gap:var(--s4)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.row.between{justify-content:space-between;flex-wrap:nowrap}
.stack{display:grid;gap:var(--s4)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.status{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);font-weight:600;color:var(--text)}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok)}
.status.busy::before{background:var(--warn)}
.status.off::before{background:var(--danger)}
.note{padding:var(--s3) var(--s4);border-radius:var(--r-sm);background:var(--surface-2);border-left:4px solid var(--accent);font-size:var(--fs-sm)}
.note.warn{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--danger);background:var(--danger-soft)}
.toast{position:fixed;z-index:60;left:50%;bottom:88px;transform:translateX(-50%);display:flex;align-items:center;gap:var(--s3);
  padding:var(--s2) var(--s2) var(--s2) var(--s4);background:var(--text);color:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);font-weight:600;max-width:calc(100vw - 24px)}
.toast .btn{background:transparent;border-color:transparent;color:inherit;text-decoration:underline}
.qr{width:200px;height:200px;border-radius:var(--r-sm);border:10px solid #fff;outline:1px solid var(--border);
  background:repeating-conic-gradient(#14171c 0 25%,#fff 0 50%) 0 0/20px 20px,#fff;display:grid;place-items:center}
.qr span{background:#fff;color:#14171c;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px}

/* ── Prototyp-Leiste (nicht Teil der App) ───────────── */
.proto{display:flex;align-items:center;gap:var(--s1);padding:4px var(--s3);background:var(--surface-2);border-bottom:2px dashed var(--border-strong);font-size:var(--fs-sm);overflow-x:auto;flex:none}
.proto strong{margin-right:var(--s2);white-space:nowrap}
.proto a,.proto button{min-height:36px;padding:0 var(--s3);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text);font:600 var(--fs-sm) var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.proto a:hover,.proto button:hover{background:var(--surface)}
.proto a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.proto .push{margin-left:auto}
.page{flex:1;min-height:0;overflow:auto;padding:var(--s5) var(--s4)}
.page>.inner{max-width:920px;margin:0 auto;display:grid;gap:var(--s5)}

.center{display:grid;place-items:start center}
.tabbar{display:flex;width:100%}
.tabbar button{flex:1;justify-content:center}
.linkrow{display:flex;gap:var(--s2)}
.linkrow .input{flex:1;min-width:0}
.qr{margin:0 auto}
</style>

<script>
(function () {
  const root = document.documentElement;
  const KEY = 'nb-proto-theme';
  root.dataset.theme = localStorage.getItem(KEY) ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  const close = (el) => {
    el.hidden = true;
    document.querySelectorAll('[data-toggle="#' + el.id + '"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  };
  const closeAll = () => document.querySelectorAll('[data-pop]:not([hidden])').forEach(close);

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-theme-toggle]')) {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(KEY, root.dataset.theme);
      return;
    }
    const tab = e.target.closest('[role="tab"]');
    if (tab) {
      const box = tab.closest('[data-tabs]');
      box.querySelectorAll('[role="tab"]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
      box.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
      return;
    }
    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const el = document.querySelector(tg.dataset.toggle);
      const wasOpen = !el.hidden;
      closeAll();
      if (!wasOpen) { el.hidden = false; tg.setAttribute('aria-expanded', 'true'); }
      return;
    }
    if (!e.target.closest('[data-pop]') || e.target.closest('[data-close]')) closeAll();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });

  let timer;
  window.toast = (msg, action) => {
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.innerHTML = '<span></span>';
    t.firstChild.textContent = msg;
    if (action) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = action;
      b.onclick = () => { t.remove(); window.toast('Wiederhergestellt'); };
      t.appendChild(b);
    }
    document.body.appendChild(t);
    clearTimeout(timer);
    timer = setTimeout(() => t.remove(), action ? 6000 : 2500);
  };
})();

document.getElementById('join').onclick = () => {
  const inp = document.getElementById('paste'), ok = /#nb-/.test(inp.value);
  inp.classList.toggle('error', !ok);
  inp.setAttribute('aria-invalid', String(!ok));
  document.getElementById('err').hidden = ok;
  if (ok) toast('Notizbuch hinzugefügt');
};
</script>
